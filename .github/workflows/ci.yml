name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      # Unit tests use only Bun built-ins and local sources.
      - run: bun test tests/unit

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Cache zcash.js build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zarca
            ~/.cargo
            ~/.rustup
          key: zcashjs-${{ hashFiles('scripts/vendor-zcashjs.sh') }}
      - run: bash scripts/vendor-zcashjs.sh
      - run: bun install
      - name: Prepare Electrobun devkit
        run: npx --yes electrobun@2.0.7 prepare
      - run: bun run typecheck
